# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (RENDER.YAML) - PHASE 8G CLOUD STAGING
# Deploys unified Web Service (Frontend + Express API) + Managed Redis Instance
# ==============================================================================

services:
  - type: web
    name: salman-driver-staging
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://salman-driver-staging.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: salman-driver-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false

  - type: redis
    name: salman-driver-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Internal service network access only
